<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PigeonChess" />
    <meta name="theme-color" content="#e9ecee" />
    <script>
      // The theme before the first paint (App.vue's switch changes it).
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('pigeonchess:theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#14191d');
      })();
    </script>
    <title>PigeonChess</title>
    <meta name="description" content="Peer-to-peer chess in your browser. Play anyone, or the computer, with no account." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PigeonChess" />
    <meta property="og:title" content="PigeonChess" />
    <meta property="og:description" content="Peer-to-peer chess in your browser. Play anyone, or the computer, with no account." />
    <meta property="og:url" content="https://chess.peer.ooo" />
    <meta property="og:image" content="https://chess.peer.ooo/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PigeonChess: peer-to-peer chess in your browser, with pigeons for knights" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PigeonChess" />
    <meta name="twitter:description" content="Peer-to-peer chess in your browser. Play anyone, or the computer, with no account." />
    <meta name="twitter:image" content="https://chess.peer.ooo/og.png?v=2" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
